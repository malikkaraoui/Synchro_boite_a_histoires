[package]
name        = "synchro_boite_a_histoires"
version     = "2.1.12"
edition     = "2021"
description = "Synchro Boîte à histoires V2 — Transfert audio vers boîte à histoires"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
hex        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }
tokio      = { version = "1", features = ["full"] }
png        = "0.17"
uuid       = { version = "1", features = ["v4"] }
zip        = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip   = true
opt-level = "z"
lto     = true
